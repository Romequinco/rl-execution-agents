version: '3'
services:

  rl-material-miax:
    image: python
    build:
      context: ../..
      dockerfile: ./dockerfiles/devcontainers/python/dockerfile
    volumes:
      - ../..:/workspace:cached
    command: /bin/sh -c "while sleep 1000; do :; done"
    environment:
      PYTHONPATH: /workspace/src:/workspace
